<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPY DOTA — HERO CODEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── Reset ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Theme ───────────────────────────────────────────────────────────────── */
:root {
  --bg:          #0a0d12;
  --panel:       #0f1318;
  --border:      #1e2228;
  --gold:        #c8a84b;
  --gold-bright: #f0c040;
  --parchment:   #d4c5a9;
  --parchment-d: #9a8e7a;
  --mute:        #4a4a5a;
  --red:         #a3251e;
  --green:       #22b822;
  --serif:       'Marcellus', Georgia, serif;
  --mono:        'JetBrains Mono', 'Courier New', monospace;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--parchment);
  font-family: var(--serif);
}

/* stage radial glow */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(200,168,75,.08) 0%, transparent 55%),
    radial-gradient(ellipse at 80%  110%, rgba(163,37,30,.05) 0%, transparent 45%);
}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.layout {
  position: relative; z-index: 1;
  height: 100vh;
  display: grid;
  grid-template-rows: 48px 1fr;
  grid-template-columns: 272px 1fr;
  grid-template-areas:
    "hdr hdr"
    "roster detail";
}

/* ── Header ──────────────────────────────────────────────────────────────── */
.hdr {
  grid-area: hdr;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,13,18,.97);
  backdrop-filter: blur(6px);
}
.hdr-title { display: flex; align-items: center; gap: 10px; }
.hdr-brand {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--gold); letter-spacing: .4em;
}
.hdr-sep { color: var(--mute); font-size: 14px; }
.hdr-page {
  font-family: var(--mono); font-size: 10px;
  color: var(--parchment-d); letter-spacing: .25em;
}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border: 1px solid rgba(200,168,75,.35);
  background: transparent;
  color: var(--gold);
  font-family: var(--mono); font-size: 9px; letter-spacing: .2em;
  cursor: pointer; text-decoration: none;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: rgba(200,168,75,.1); border-color: var(--gold); }

/* ── Roster ──────────────────────────────────────────────────────────────── */
.roster {
  grid-area: roster;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
}
.roster-search {
  padding: 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.roster-search input {
  width: 100%;
  background: rgba(0,0,0,.4);
  border: 1px solid var(--border);
  color: var(--parchment);
  font-family: var(--mono); font-size: 10px; letter-spacing: .05em;
  padding: 7px 10px; outline: none;
}
.roster-search input:focus { border-color: rgba(200,168,75,.4); }
.roster-search input::placeholder { color: var(--mute); }

.roster-meta {
  padding: 5px 10px 4px;
  font-family: var(--mono); font-size: 9px;
  color: var(--mute); letter-spacing: .2em;
  flex-shrink: 0;
}

.hero-list {
  flex: 1; overflow-y: auto;
}
.hero-list::-webkit-scrollbar { width: 3px; }
.hero-list::-webkit-scrollbar-thumb { background: var(--border); }

/* ── Hero list item ──────────────────────────────────────────────────────── */
.hero-item {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 10px;
  cursor: pointer;
  border-bottom: 1px solid rgba(30,34,40,.5);
  border-left: 2px solid transparent;
  transition: background .1s;
}
.hero-item:hover  { background: rgba(200,168,75,.05); }
.hero-item.active {
  background: rgba(200,168,75,.09);
  border-left-color: var(--gold);
}

.h-thumb {
  width: 50px; height: 28px;
  object-fit: cover; flex-shrink: 0;
  background: #0a0d12;
}
.h-info { flex: 1; min-width: 0; }
.h-name {
  font-family: var(--serif); font-size: 12px;
  color: var(--parchment);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.h-roles {
  font-family: var(--mono); font-size: 8px;
  color: var(--mute); letter-spacing: .08em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 1px;
}
.h-wr {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  flex-shrink: 0;
}

/* ── Detail ──────────────────────────────────────────────────────────────── */
.detail {
  grid-area: detail;
  overflow-y: auto; padding: 18px 20px;
}
.detail::-webkit-scrollbar { width: 3px; }
.detail::-webkit-scrollbar-thumb { background: var(--border); }

/* ── Panel ───────────────────────────────────────────────────────────────── */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  position: relative;
}
/* CSS corner ornaments */
.panel::before, .panel::after,
.panel > .c-tr, .panel > .c-bl, .panel > .c-br {
  content: '';
  position: absolute;
  width: 7px; height: 7px;
  border-color: rgba(200,168,75,.4);
  border-style: solid;
  pointer-events: none;
}
.panel::before { top: -1px; left: -1px;  border-width: 1px 0 0 1px; }
.panel::after  { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
.panel > .c-bl { bottom: -1px; left: -1px;  border-width: 0 0 1px 1px; }
.panel > .c-br { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

/* ── Hero header ─────────────────────────────────────────────────────────── */
.hero-hdr {
  padding: 18px 22px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.hero-portrait {
  width: 156px; height: 88px; object-fit: cover; flex-shrink: 0;
  border: 1px solid rgba(200,168,75,.3);
  background: #0a0d12;
}
.hero-title { flex: 1; }
.hero-name {
  font-family: var(--serif);
  font-size: clamp(1.3rem, 2.8vw, 1.9rem);
  color: var(--gold); line-height: 1;
}
.hero-attr {
  font-family: var(--mono); font-size: 9px;
  color: var(--mute); letter-spacing: .2em;
  margin-top: 6px;
}
.roles-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.role-tag {
  font-family: var(--mono); font-size: 8px; letter-spacing: .12em;
  padding: 2px 7px; color: var(--parchment-d);
  border: 1px solid rgba(200,168,75,.28);
}
.wr-badge { text-align: right; margin-left: auto; }
.wr-label { font-family: var(--mono); font-size: 9px; color: var(--mute); letter-spacing: .25em; }
.wr-value { font-family: var(--serif); font-size: 42px; line-height: 1; }
.wr-games { font-family: var(--mono); font-size: 9px; color: var(--mute); }

/* ── Tabs ────────────────────────────────────────────────────────────────── */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}
.tab {
  padding: 9px 18px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .22em;
  color: var(--mute);
  cursor: pointer; border: none; background: transparent;
  border-bottom: 2px solid transparent;
  transition: color .12s, border-color .12s;
}
.tab:hover { color: var(--parchment); }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }

.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── Section label ───────────────────────────────────────────────────────── */
.sec-label {
  font-family: var(--mono); font-size: 9px; letter-spacing: .3em;
  color: var(--mute); margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}

/* ── Bracket bars ────────────────────────────────────────────────────────── */
.br-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 9px;
}
.br-name {
  font-family: var(--serif); font-size: 12px;
  color: var(--parchment-d); width: 96px; flex-shrink: 0;
}
.br-track { flex: 1; height: 4px; background: #1a1412; }
.br-fill  { height: 100%; transition: width .45s ease; }
.br-pct {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  width: 34px; text-align: right; flex-shrink: 0;
}
.br-n {
  font-family: var(--mono); font-size: 9px; color: var(--mute);
  width: 68px; text-align: right; flex-shrink: 0;
}

/* ── Item phase ──────────────────────────────────────────────────────────── */
.phase { margin-bottom: 20px; }
.phase-label {
  font-family: var(--mono); font-size: 9px; letter-spacing: .25em;
  color: var(--mute); margin-bottom: 8px;
}
.item-row { display: flex; gap: 6px; flex-wrap: wrap; }
.item-icon {
  width: 44px; height: 44px; flex-shrink: 0;
  border: 1px solid rgba(200,168,75,.2);
  background: #0a0d12; overflow: hidden;
  position: relative; cursor: default;
}
.item-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item-icon:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 4px); left: 50%;
  transform: translateX(-50%);
  background: #0a0d12; border: 1px solid var(--gold);
  color: var(--parchment);
  font-family: var(--mono); font-size: 9px;
  padding: 3px 8px; white-space: nowrap;
  z-index: 20; letter-spacing: .04em;
  pointer-events: none;
}

/* ── Matchup rows ────────────────────────────────────────────────────────── */
.matchup-group { margin-bottom: 22px; }
.matchup-group-label {
  font-family: var(--mono); font-size: 9px; letter-spacing: .25em;
  color: var(--mute); padding-bottom: 6px;
  border-bottom: 1px solid var(--border); margin-bottom: 6px;
}
.m-row {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(30,34,40,.5);
}
.m-thumb {
  width: 42px; height: 24px; object-fit: cover; flex-shrink: 0;
  background: #0a0d12;
}
.m-name { font-family: var(--serif); font-size: 13px; flex: 1; }
.m-wr   { font-family: var(--mono); font-size: 11px; font-weight: 600; flex-shrink: 0; }
.m-n    { font-family: var(--mono); font-size: 9px; color: var(--mute); width: 58px; text-align: right; flex-shrink: 0; }

/* ── Lane roles ──────────────────────────────────────────────────────────── */
.lane-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.lane-card {
  padding: 14px 16px;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--border);
}
.lane-card-title {
  font-family: var(--mono); font-size: 9px; letter-spacing: .22em;
  color: var(--mute); margin-bottom: 8px;
}
.lane-wr {
  font-family: var(--serif); font-size: 26px;
}
.lane-games {
  font-family: var(--mono); font-size: 9px; color: var(--mute); margin-top: 2px;
}

/* ── State messages ──────────────────────────────────────────────────────── */
.msg {
  padding: 36px; text-align: center;
  font-family: var(--mono); font-size: 11px;
  color: var(--mute); letter-spacing: .2em;
  line-height: 1.8;
}
.msg .sub { font-size: 9px; margin-top: 6px; }
</style>
</head>
<body>
<div class="layout">

  <!-- ── Header ── -->
  <header class="hdr">
    <div class="hdr-title">
      <span class="hdr-brand">SPY DOTA</span>
      <span class="hdr-sep">/</span>
      <span class="hdr-page">✦ HERO CODEX</span>
    </div>
    <a href="/" class="btn">← ГЛАВНАЯ</a>
  </header>

  <!-- ── Roster ── -->
  <aside class="roster">
    <div class="roster-search">
      <input type="text" id="search" placeholder="ПОИСК ГЕРОЯ..." autocomplete="off" spellcheck="false">
    </div>
    <div class="roster-meta" id="rosterMeta">ИНИЦИАЛИЗАЦИЯ...</div>
    <div class="hero-list" id="heroList">
      <div class="msg">ЗАГРУЗКА КОДЕКСА...</div>
    </div>
  </aside>

  <!-- ── Detail ── -->
  <main class="detail" id="detail">
    <div class="msg" style="padding-top:72px">
      ВЫБЕРИ ГЕРОЯ ИЗ КОДЕКСА
      <div class="sub">// 125+ ГЕРОЕВ · ДАННЫЕ OpenDota</div>
    </div>
  </main>

</div>

<script>
'use strict';

const API = 'https://api.opendota.com/api';
const CDN = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react';

const BRACKETS = [
  'Геральд','Страж','Рыцарь','Архон',
  'Легенда','Древний','Божественный','Бессмертный',
];

const PHASE_KEYS = [
  { key: 'start_game_items', label: 'СТАРТОВЫЕ ПРЕДМЕТЫ' },
  { key: 'early_game_items', label: 'РАННЯЯ ИГРА' },
  { key: 'mid_game_items',   label: 'СЕРЕДИНА ИГРЫ' },
  { key: 'late_game_items',  label: 'ПОЗДНЯЯ ИГРА' },
];

const LANE_NAMES = { 1: 'ЛЕГКАЯ ЛИНИЯ', 2: 'СРЕДНЯЯ ЛИНИЯ', 3: 'ТЯЖЕЛАЯ ЛИНИЯ', 4: 'ДЖУНГЛИ' };

const ATTR_LABELS = { agi: 'ЛОВКОСТЬ', str: 'СИЛА', int: 'ИНТЕЛЛЕКТ', all: 'УНИВЕРСАЛ' };

// ── State ─────────────────────────────────────────────────────────────────
const S = {
  heroes:   [],              // processed hero objects
  heroById: {},              // id → hero
  idMap:    {},              // numeric item id → short name
  selected: null,            // currently selected hero object
  cache:    {},              // hero id → { matchups, items, lanes }
};

// ── Utils ─────────────────────────────────────────────────────────────────
function wrColor(wr) {
  if (wr >= 52) return '#22b822';
  if (wr >= 48) return '#c8a84b';
  return '#8a2020';
}

function shortName(raw) {
  return raw.name.replace('npc_dota_hero_', '');
}

function heroOverallWr(raw) {
  let pick = 0, win = 0;
  for (let i = 1; i <= 8; i++) {
    pick += raw[`${i}_pick`] || 0;
    win  += raw[`${i}_win`]  || 0;
  }
  return pick > 0 ? { wr: Math.round(win / pick * 100), pick, win } : null;
}

function fmt(n) { return n.toLocaleString('ru'); }

function el(id) { return document.getElementById(id); }

// ── Boot ──────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const [heroStats, itemConst] = await Promise.all([
      fetch(`${API}/heroStats`).then(r => { if (!r.ok) throw new Error(`heroStats ${r.status}`); return r.json(); }),
      fetch(`${API}/constants/items`).then(r => { if (!r.ok) throw new Error(`items ${r.status}`); return r.json(); }),
    ]);

    // Item id → name map
    for (const [name, val] of Object.entries(itemConst)) {
      if (val?.id != null) S.idMap[val.id] = name.replace(/^item_/, '');
    }

    // Build hero list
    S.heroes = heroStats
      .filter(h => h.localized_name)
      .map(h => ({
        id:    h.id,
        short: shortName(h),
        name:  h.localized_name,
        roles: h.roles || [],
        attr:  h.primary_attr || 'agi',
        raw:   h,
        wr:    heroOverallWr(h),
      }))
      .sort((a, b) => a.name.localeCompare(b.name, 'ru'));

    S.heroes.forEach(h => { S.heroById[h.id] = h; });

    renderRoster(S.heroes);
  } catch (e) {
    el('heroList').innerHTML = `<div class="msg" style="color:#ff6b5e">ОШИБКА: ${e.message}</div>`;
    el('rosterMeta').textContent = 'ОШИБКА ЗАГРУЗКИ';
  }
}

// ── Roster ────────────────────────────────────────────────────────────────
function renderRoster(heroes) {
  el('rosterMeta').textContent = `${heroes.length} ГЕРОЕВ`;

  if (!heroes.length) {
    el('heroList').innerHTML = '<div class="msg">НЕ НАЙДЕНО</div>';
    return;
  }

  el('heroList').innerHTML = heroes.map(h => {
    const wr    = h.wr;
    const wrStr = wr ? `${wr.wr}%` : '—';
    const color = wr ? wrColor(wr.wr) : 'var(--mute)';
    const roles = h.roles.slice(0, 3).join(' · ').toUpperCase();
    const act   = S.selected?.id === h.id ? ' active' : '';
    return `<div class="hero-item${act}" data-id="${h.id}">
      <img class="h-thumb" src="${CDN}/heroes/${h.short}.png" alt="${h.name}" loading="lazy" onerror="this.style.opacity=0">
      <div class="h-info">
        <div class="h-name">${h.name}</div>
        <div class="h-roles">${roles}</div>
      </div>
      <span class="h-wr" style="color:${color}">${wrStr}</span>
    </div>`;
  }).join('');

  el('heroList').querySelectorAll('.hero-item').forEach(node => {
    node.addEventListener('click', () => selectHero(+node.dataset.id));
  });
}

// ── Search ────────────────────────────────────────────────────────────────
el('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  const filtered = q
    ? S.heroes.filter(h =>
        h.name.toLowerCase().includes(q) ||
        h.short.toLowerCase().includes(q) ||
        h.roles.some(r => r.toLowerCase().includes(q))
      )
    : S.heroes;
  renderRoster(filtered);
});

// ── Select hero ───────────────────────────────────────────────────────────
async function selectHero(id) {
  const hero = S.heroById[id];
  if (!hero) return;
  S.selected = hero;

  // Update roster highlight
  document.querySelectorAll('.hero-item').forEach(n => {
    n.classList.toggle('active', +n.dataset.id === id);
  });

  renderSkeleton(hero);

  try {
    if (!S.cache[id]) {
      const [matchups, items, lanes] = await Promise.all([
        fetch(`${API}/heroes/${id}/matchups`).then(r => r.json()),
        fetch(`${API}/heroes/${id}/itemPopularity`).then(r => r.json()),
        fetch(`${API}/scenarios/laneRoles?hero_id=${id}`).then(r => r.json()),
      ]);
      S.cache[id] = { matchups, items, lanes };
    }
    fillDetail(hero, S.cache[id]);
  } catch (e) {
    const d = el('detail');
    d.insertAdjacentHTML('beforeend',
      `<div class="msg" style="color:#ff6b5e;padding:16px">ОШИБКА: ${e.message}</div>`);
  }
}

// ── Render skeleton (header + tabs, bracket data from raw) ────────────────
function renderSkeleton(hero) {
  const hs   = hero.raw;
  const stat = hero.wr;
  const attr = ATTR_LABELS[hero.attr] || hero.attr;

  const brackets = BRACKETS.map((label, i) => ({
    label,
    pick: hs[`${i+1}_pick`] || 0,
    win:  hs[`${i+1}_win`]  || 0,
  })).filter(b => b.pick > 100);

  const brHtml = brackets.length
    ? brackets.map(b => {
        const wr = Math.round(b.win / b.pick * 100);
        return `<div class="br-row">
          <span class="br-name">${b.label}</span>
          <div class="br-track"><div class="br-fill" style="width:${wr}%;background:${wrColor(wr)}"></div></div>
          <span class="br-pct" style="color:${wrColor(wr)}">${wr}%</span>
          <span class="br-n">${fmt(b.pick)}</span>
        </div>`;
      }).join('')
    : '<div class="msg" style="padding:18px">НЕТ ДАННЫХ</div>';

  el('detail').innerHTML = `
    <!-- Hero header -->
    <div class="panel" style="margin-bottom:14px">
      <div class="c-bl"></div><div class="c-br"></div>
      <div class="hero-hdr">
        <img class="hero-portrait" id="hPortrait"
          src="${CDN}/heroes/${hero.short}_vert.jpg" alt="${hero.name}"
          onerror="this.src='${CDN}/heroes/${hero.short}.png'">
        <div class="hero-title">
          <div class="hero-name">${hero.name}</div>
          <div class="hero-attr">${attr} · #${hero.id}</div>
          <div class="roles-row">
            ${hero.roles.map(r => `<span class="role-tag">${r.toUpperCase()}</span>`).join('')}
          </div>
        </div>
        ${stat ? `
        <div class="wr-badge">
          <div class="wr-label">ОБЩИЙ ВИНРЕЙТ</div>
          <div class="wr-value" style="color:${wrColor(stat.wr)}">${stat.wr}%</div>
          <div class="wr-games">${fmt(stat.pick)} матчей</div>
        </div>` : ''}
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-pane="overview">БРЕКЕТЫ</button>
      <button class="tab" data-pane="items">ПРЕДМЕТЫ</button>
      <button class="tab" data-pane="matchups">ПРОТИВНИКИ</button>
      <button class="tab" data-pane="lanes">ЛИНИИ</button>
    </div>

    <!-- Overview: bracket winrates -->
    <div class="tab-pane active" id="pane-overview">
      <div class="panel" style="padding:18px 22px">
        <div class="c-bl"></div><div class="c-br"></div>
        <div class="sec-label">ВИНРЕЙТ ПО БРЕКЕТАМ</div>
        ${brHtml}
      </div>
    </div>

    <!-- Items -->
    <div class="tab-pane" id="pane-items">
      <div class="panel" style="padding:18px 22px">
        <div class="c-bl"></div><div class="c-br"></div>
        <div class="sec-label">СБОРКА ПРЕДМЕТОВ</div>
        <div id="items-body"><div class="msg">ЗАГРУЗКА...</div></div>
      </div>
    </div>

    <!-- Matchups -->
    <div class="tab-pane" id="pane-matchups">
      <div class="panel" style="padding:18px 22px">
        <div class="c-bl"></div><div class="c-br"></div>
        <div class="sec-label">ПРОТИВОСТОЯНИЯ</div>
        <div id="matchups-body"><div class="msg">ЗАГРУЗКА...</div></div>
      </div>
    </div>

    <!-- Lanes -->
    <div class="tab-pane" id="pane-lanes">
      <div class="panel" style="padding:18px 22px">
        <div class="c-bl"></div><div class="c-br"></div>
        <div class="sec-label">РОЛИ НА ЛИНИЯХ</div>
        <div id="lanes-body"><div class="msg">ЗАГРУЗКА...</div></div>
      </div>
    </div>
  `;

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      el(`pane-${tab.dataset.pane}`)?.classList.add('active');
    });
  });
}

// ── Fill detail panes after data arrives ──────────────────────────────────
function fillDetail(hero, { matchups, items, lanes }) {
  fillItems(items);
  fillMatchups(hero, matchups);
  fillLanes(hero, lanes);
}

// Items ───────────────────────────────────────────────────────────────────
function fillItems(pop) {
  const body = el('items-body');
  if (!body) return;

  const phases = PHASE_KEYS.map(({ key, label }) => {
    const phase = pop[key] || {};
    const resolved = Object.entries(phase)
      .map(([idStr, count]) => [S.idMap[+idStr] || '', count])
      .filter(([name]) => name && !name.includes('recipe') && !name.includes('river_painter'))
      .sort(([, a], [, b]) => b - a)
      .slice(0, 14);
    return { label, resolved };
  }).filter(p => p.resolved.length);

  if (!phases.length) {
    body.innerHTML = '<div class="msg">НЕТ ДАННЫХ О ПРЕДМЕТАХ</div>';
    return;
  }

  body.innerHTML = phases.map(({ label, resolved }) => `
    <div class="phase">
      <div class="phase-label">${label}</div>
      <div class="item-row">
        ${resolved.map(([name, count]) => `
          <div class="item-icon" data-tip="${name} · ${fmt(count)} матчей">
            <img src="${CDN}/items/${name}.png" alt="${name}"
              onerror="this.parentElement.style.display='none'">
          </div>`).join('')}
      </div>
    </div>`).join('');
}

// Matchups ────────────────────────────────────────────────────────────────
function fillMatchups(hero, matchups) {
  const body = el('matchups-body');
  if (!body) return;

  if (!matchups?.length) {
    body.innerHTML = '<div class="msg">НЕТ ДАННЫХ</div>';
    return;
  }

  const withWr = matchups
    .filter(m => m.games_played >= 300)
    .map(m => ({
      ...m,
      hero: S.heroById[m.hero_id],
      wr: Math.round(m.wins / m.games_played * 100),
    }))
    .filter(m => m.hero);

  const best  = [...withWr].sort((a, b) => b.wr - a.wr).slice(0, 8);
  const worst = [...withWr].sort((a, b) => a.wr - b.wr).slice(0, 8);

  function row(m) {
    return `<div class="m-row">
      <img class="m-thumb" src="${CDN}/heroes/${m.hero.short}.png" alt="${m.hero.name}"
        onerror="this.style.opacity=0">
      <span class="m-name">${m.hero.name}</span>
      <span class="m-wr" style="color:${wrColor(m.wr)}">${m.wr}%</span>
      <span class="m-n">${fmt(m.games_played)}</span>
    </div>`;
  }

  body.innerHTML = `
    <div class="matchup-group">
      <div class="matchup-group-label">${hero.name.toUpperCase()} ПОБЕЖДАЕТ ЧАЩЕ (топ-8)</div>
      ${best.map(row).join('')}
    </div>
    <div class="matchup-group">
      <div class="matchup-group-label">СЛОЖНЫЕ ПРОТИВНИКИ ДЛЯ ${hero.name.toUpperCase()} (топ-8)</div>
      ${worst.map(row).join('')}
    </div>`;
}

// Lane Roles ──────────────────────────────────────────────────────────────
function fillLanes(hero, lanes) {
  const body = el('lanes-body');
  if (!body) return;

  if (!lanes?.length) {
    body.innerHTML = '<div class="msg">НЕТ ДАННЫХ О ЛИНИЯХ</div>';
    return;
  }

  // Aggregate by lane_role (sum games/wins across time buckets)
  const byLane = {};
  for (const row of lanes) {
    const r = row.lane_role;
    if (!byLane[r]) byLane[r] = { games: 0, wins: 0 };
    byLane[r].games += row.games || 0;
    byLane[r].wins  += row.wins  || 0;
  }

  const cards = Object.entries(byLane)
    .filter(([, v]) => v.games >= 100)
    .sort(([a], [b]) => +a - +b)
    .map(([laneId, v]) => {
      const wr    = Math.round(v.wins / v.games * 100);
      const label = LANE_NAMES[+laneId] || `ЛИНИЯ ${laneId}`;
      return `<div class="lane-card">
        <div class="lane-card-title">${label}</div>
        <div class="lane-wr" style="color:${wrColor(wr)}">${wr}%</div>
        <div class="lane-games">${fmt(v.games)} матчей</div>
      </div>`;
    });

  if (!cards.length) {
    body.innerHTML = '<div class="msg">НЕТ ДАННЫХ О ЛИНИЯХ</div>';
    return;
  }

  body.innerHTML = `<div class="lane-grid">${cards.join('')}</div>`;
}

// ── Start ─────────────────────────────────────────────────────────────────
boot();
</script>
